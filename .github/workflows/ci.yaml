name: Build and Push Docker Images

on:
  push:
    branches: [ "develop", "main", "ci-pipeline" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [api, frontend, quotes]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Cache Docker layer
      uses: actions/cache@v2
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
 
    - name: Build Docker image for ${{ matrix.service }}
      run: |
        docker build -t ravinekkanti/${{ matrix.service }}:latest -f ./${{ matrix.service }}/app.dockerfile ${{ matrix.service }}
          
    - name: Push Docker image to Docker Hub
      run: |
        docker push ravinekkanti/${{ matrix.service }}:latest
